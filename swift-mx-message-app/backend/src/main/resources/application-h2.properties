# =====================================================================
# H2 Embedded Profile for Local Testing & Standalone Execution
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/swift_mx_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
