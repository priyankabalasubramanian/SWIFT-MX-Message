# =====================================================================
# SWIFT MX Message Portal - Backend Configuration
# =====================================================================

server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Active Spring Profile
# Defaults to 'h2' embedded database for immediate zero-config startup.
# To connect to production MySQL: set SPRING_PROFILES_ACTIVE=mysql
# ---------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ---------------------------------------------------------------------
# MySQL Database Connectivity (Active when profile 'mysql' is selected)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:swift_mx_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# Spring Data JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# JWT Security Configuration
# ---------------------------------------------------------------------
# 256-bit secret key for HMAC-SHA256 signature
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 24 hours (86,400,000 milliseconds)
jwt.expiration=86400000

# ---------------------------------------------------------------------
# CORS Configuration (Restricted to frontend origins)
# ---------------------------------------------------------------------
cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5174}
